<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>أوراس | فتح قاعدة البيانات</title>
  <style>
    *{box-sizing:border-box} body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 10% 0%,#f8edce,#eee9de 48%,#e8e3d8);font-family:Tahoma,Arial,sans-serif;color:#28251f}
    main{width:min(520px,100%);background:#fff;border:1px solid #e4dcc8;border-radius:22px;padding:36px;box-shadow:0 18px 55px #4b3b1c1c}
    .brand{display:flex;align-items:center;gap:12px;margin-bottom:24px}.mark{display:grid;place-items:center;width:52px;height:52px;border-radius:15px;background:#f3e4bc;font-size:27px}.brand strong{display:block;color:#927126;font-size:21px}.brand small{color:#777}
    h1{font-size:24px;margin:0 0 12px}p{line-height:1.8;color:#686357;margin:0 0 18px}.notice{padding:13px 15px;border-radius:12px;background:#fff7df;border:1px solid #e9d6a4;color:#765b1f;font-size:13px}
    label{display:block;font-weight:bold;font-size:14px;margin:17px 0 8px}input[type=password]{width:100%;direction:ltr;text-align:left;border:1px solid #d8d2c5;border-radius:10px;padding:13px;font-size:16px;outline:0}input:focus{border-color:#b58c35;box-shadow:0 0 0 3px #e8d6a766}
    .check{display:flex;align-items:flex-start;gap:9px;font-weight:normal;line-height:1.6;color:#544d40}.check input{margin-top:4px}button{border:0;border-radius:10px;background:#b88f38;color:#fff;width:100%;padding:14px;font-weight:bold;font-size:16px;cursor:pointer;margin-top:14px}button:hover{background:#a27b2c}button:disabled{opacity:.6;cursor:wait}.error{min-height:22px;color:#a12727;font-size:13px;line-height:1.6;margin-top:10px}.hidden{display:none!important}.foot{font-size:12px;color:#777;margin-top:18px;margin-bottom:0}
  </style>
</head>
<body>
  <main>
    <div class="brand"><div class="mark" aria-hidden="true">🦷</div><div><strong>أوراس</strong><small>إدارة عيادة الأسنان</small></div></div>
    <h1 id="title">فتح قاعدة البيانات المشفّرة</h1>
    <p id="description">جاري التحقق من قاعدة البيانات…</p>
    <p class="notice">عبارة التشفير مختلفة عن كلمات مرور المدير والموظفين. احتفظ بها في مكان آمن؛ عند فقدانها لا يمكن فتح البيانات أو النسخ المشفّرة.</p>
    <form autocomplete="off" id="unlockForm" class="hidden">
      <label for="passphrase">عبارة التشفير</label>
      <input id="passphrase" type="password" autocomplete="off" maxlength="1024" required autofocus>
      <div id="newDatabaseFields" class="hidden">
        <label for="confirmPassphrase">تأكيد عبارة التشفير</label>
        <input id="confirmPassphrase" type="password" autocomplete="off" maxlength="1024">
        <label class="check"><input type="checkbox" id="savedPassphrase"> <span>حفظت عبارة التشفير في مكان آمن وأفهم أنه لا يمكن استرجاع البيانات بدونها.</span></label>
      </div>
      <div id="error" class="error" role="alert" aria-live="polite"></div>
      <button type="submit" id="submit">فتح النظام</button>
    </form>
    <p class="foot">تُخزّن بيانات العيادة على هذا الجهاز فقط. لا تتصل هذه الصفحة بخادم.</p>
  </main>
  <script src="unlock.js"></script>
</body>
</html>
